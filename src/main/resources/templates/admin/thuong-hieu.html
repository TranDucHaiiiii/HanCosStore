<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thương hiệu - HANCOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/categories.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('thuong-hieu')}"></div>

<div class="main-content">
    <header class="top-header">
        <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1">Quản lý thương hiệu</h4>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/thuong-hieu/add}"
               class="btn btn-dark rounded-0 fw-700 text-uppercase small letter-spacing-1 px-4 py-2">
                <i class="fas fa-plus me-2"></i> Thêm thương hiệu
            </a>
            <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center"
                 style="width: 45px; height: 45px;">
                <i class="fas fa-crown"></i>
            </div>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success border-0 rounded-0 small mb-4"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4"
         th:text="${errorMessage}"></div>

    <form class="d-flex flex-wrap gap-2 align-items-center mb-3" method="get" th:action="@{/admin/thuong-hieu}">
        <div class="input-group" style="max-width: 360px;">
            <input type="text" class="form-control" name="q" placeholder="Tìm theo mã hoặc tên"
                   th:value="${q}">
            <button class="btn btn-dark" type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="size" th:value="${pageSize}">
    </form>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4" style="width: 80px;">ID</th>
                        <th>Mã</th>
                        <th>Tên thương hiệu</th>
                        <th>Quốc gia</th>
                        <th>Ngày tạo</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="th : ${thuongHieus}">
                        <td class="ps-4 fw-700" th:text="${th.id}">1</td>
                        <td th:text="${th.ma}">TH001</td>
                        <td th:text="${th.ten}">Nike</td>
                        <td th:text="${th.quocGia}">USA</td>
                        <td class="small text-muted"
                            th:text="${th.ngayTao != null ? #temporals.format(th.ngayTao, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/thuong-hieu/edit/{id}(id=${th.id})}" class="btn-action"
                                   title="Chỉnh sửa">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button class="btn-action btn-delete" title="Xóa"
                                        th:onclick="'deleteThuongHieu(' + ${th.id} + ')'">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(thuongHieus)}">
                        <td colspan="6" class="text-center py-5 text-muted">Chưa có thương hiệu nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mt-3"
         th:if="${totalElements > 0}">
        <div class="small text-muted">
            Hiển thị
            <span th:text="${fromItem}">1</span>
            -
            <span th:text="${toItem}">10</span>
            /
            <span th:text="${totalElements}">0</span>
            thương hiệu
        </div>
        <nav th:if="${totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage <= 1 ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/thuong-hieu(q=${q},page=${currentPage - 1},size=${pageSize})}">
                        Trước
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/thuong-hieu(q=${q},page=${i},size=${pageSize})}"
                       th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/thuong-hieu(q=${q},page=${currentPage + 1},size=${pageSize})}">
                        Sau
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/admin/thuong-hieu.js}"></script>
</body>
</html>
