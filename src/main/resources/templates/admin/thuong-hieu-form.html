<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${thuongHieu.id == null ? 'Thêm thương hiệu' : 'Sửa thương hiệu'} + ' - HANCOS'">Thương hiệu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/category-form.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('thuong-hieu')}"></div>

<div class="main-content">
    <header class="top-header">
        <div class="d-flex align-items-center">
            <a th:href="@{/admin/thuong-hieu}" class="btn-action me-3" aria-label="Quay lại">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1"
                th:text="${thuongHieu.id == null ? 'Thêm thương hiệu' : 'Sửa thương hiệu'}">Thương hiệu</h4>
        </div>
        <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center"
             style="width: 45px; height: 45px;">
            <i class="fas fa-crown"></i>
        </div>
    </header>

    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4"
         th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body p-4">
            <form id="thuongHieuForm" th:action="@{/admin/thuong-hieu/save}" th:object="${thuongHieu}" method="post" class="row g-3" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="col-md-4">
                    <label class="form-label fw-700">Mã thương hiệu <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{ma}" required maxlength="50"
                           pattern="[A-Za-z0-9_-]{2,50}" placeholder="VD: NIKE">
                    <div class="form-text">2-50 ký tự, chỉ dùng chữ, số, _ hoặc -.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-700">Tên thương hiệu <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{ten}" required minlength="2" maxlength="150" placeholder="VD: Nike">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-700">Quốc gia</label>
                    <input type="text" class="form-control" th:field="*{quocGia}" maxlength="100" placeholder="VD: USA">
                </div>

                <div class="col-12 mt-3 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-5 py-2 fw-700">
                        <i class="fas fa-save me-2"></i> Lưu thương hiệu
                    </button>
                    <a th:href="@{/admin/thuong-hieu}" class="btn btn-outline-secondary px-4 py-2 ms-2">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('thuongHieuForm').addEventListener('submit', (event) => {
        const form = event.currentTarget;
        const ma = form.querySelector('[name="ma"]');
        const ten = form.querySelector('[name="ten"]');
        const quocGia = form.querySelector('[name="quocGia"]');
        const code = ma.value.trim().toUpperCase();
        const name = ten.value.trim();

        if (!/^[A-Z0-9_-]{2,50}$/.test(code)) {
            event.preventDefault();
            Swal.fire('Lỗi', 'Mã thương hiệu chỉ gồm chữ, số, _ hoặc -, dài 2-50 ký tự.', 'error');
            ma.focus();
            return;
        }
        if (name.length < 2 || name.length > 150) {
            event.preventDefault();
            Swal.fire('Lỗi', 'Tên thương hiệu phải dài từ 2 đến 150 ký tự.', 'error');
            ten.focus();
            return;
        }
        if (quocGia.value.trim().length > 100) {
            event.preventDefault();
            Swal.fire('Lỗi', 'Quốc gia không được vượt quá 100 ký tự.', 'error');
            quocGia.focus();
            return;
        }

        ma.value = code;
        ten.value = name;
        quocGia.value = quocGia.value.trim();
    });
</script>
</body>
</html>
