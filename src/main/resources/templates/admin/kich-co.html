<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý kích cỡ - HANCOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/categories.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('kich-co')}"></div>

<div class="main-content">
    <header class="top-header">
        <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1">Quản lý kích cỡ</h4>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/kich-co/add}"
               class="btn btn-dark rounded-0 fw-700 text-uppercase small letter-spacing-1 px-4 py-2">
                <i class="fas fa-plus me-2"></i> Thêm size
            </a>
            <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center"
                 style="width: 45px; height: 45px;">
                <i class="fas fa-ruler-combined"></i>
            </div>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success border-0 rounded-0 small mb-4"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4"
         th:text="${errorMessage}"></div>

    <form class="d-flex flex-wrap gap-2 align-items-center mb-3" method="get" th:action="@{/admin/kich-co}">
        <div class="input-group" style="max-width: 360px;">
            <input type="text" class="form-control" name="q" placeholder="Tìm theo tên hoặc loại"
                   th:value="${q}">
            <button class="btn btn-dark" type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <select class="form-select" name="loai" style="max-width: 200px;" onchange="this.form.submit()">
            <option value="" th:selected="${loai == null or loai == ''}">Tất cả loại</option>
            <option value="AO" th:selected="${loai == 'AO'}">Áo</option>
            <option value="QUAN" th:selected="${loai == 'QUAN'}">Quần</option>
            <option value="CHUNG" th:selected="${loai == 'CHUNG'}">Dùng chung</option>
        </select>
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="size" th:value="${pageSize}">
    </form>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4" style="width: 80px;">ID</th>
                        <th>Tên kích cỡ</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="size : ${kichCos}">
                        <td class="ps-4 fw-700" th:text="${size.id}">1</td>
                        <td class="fw-700" th:text="${size.tenKichCo}">M</td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2 bg-light text-dark border"
                                  th:text="${size.loai == 'AO' ? 'Áo' : (size.loai == 'QUAN' ? 'Quần' : 'Dùng chung')}">Áo</span>
                        </td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${size.trangThai == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${size.trangThai}">ACTIVE</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/kich-co/edit/{id}(id=${size.id})}" class="btn-action" title="Chỉnh sửa">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button class="btn-action btn-delete" title="Ngưng hoạt động"
                                        th:onclick="'deleteKichCo(' + ${size.id} + ')'">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(kichCos)}">
                        <td colspan="5" class="text-center py-5 text-muted">Chưa có kích cỡ nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mt-3"
         th:if="${totalElements > 0}">
        <div class="small text-muted">
            Hiển thị
            <span th:text="${fromItem}">1</span>
            -
            <span th:text="${toItem}">10</span>
            /
            <span th:text="${totalElements}">0</span>
            kích cỡ
        </div>
        <nav th:if="${totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage <= 1 ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/kich-co(q=${q},loai=${loai},page=${currentPage - 1},size=${pageSize})}">
                        Trước
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/kich-co(q=${q},loai=${loai},page=${i},size=${pageSize})}"
                       th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/kich-co(q=${q},loai=${loai},page=${currentPage + 1},size=${pageSize})}">
                        Sau
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/admin/kich-co.js}"></script>
</body>
</html>
