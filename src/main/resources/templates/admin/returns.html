<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý trả hàng - HANCOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/orders.css}">
    <style>
        .return-status { border-radius: 999px; border: 1px solid transparent; padding: 8px 14px; font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; white-space: nowrap; }
        .return-status-pending { background: #fff8db; color: #9a6b00; border-color: #ffe08a; }
        .return-status-approved { background: #e7f8ee; color: #16784b; border-color: #b8ebcf; }
        .return-status-rejected { background: #fde8eb; color: #b42334; border-color: #f7b8c0; }
        .return-status-inspection { background: #e7f0ff; color: #1e5bb8; border-color: #b9d2ff; }
        .return-status-refunded { background: #eee9ff; color: #5a3db5; border-color: #d4c8ff; }
        .return-status-done { background: #e9f7f6; color: #0f766e; border-color: #b7e3df; }
        .refund-chip { border-radius: 7px; border: 1px solid #e5e7eb; background: #f8fafc; color: #334155; padding: 5px 9px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .filter-btn,
        .filter-btn:hover,
        .filter-btn:focus,
        .btn-action,
        .btn-action:hover,
        .btn-action:focus { text-decoration: none; }
    </style>
</head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar('returns')}"></div>

<div class="main-content">
    <header class="top-header">
        <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1">Quản lý yêu cầu trả hàng</h4>
        <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center" style="width:45px;height:45px;">
            <i class="fas fa-undo"></i>
        </div>
    </header>

    <div class="card mb-4">
        <div class="card-body p-4">
            <div class="d-flex gap-2 flex-wrap">
                <a th:each="st : ${statuses}"
                   class="filter-btn"
                   th:classappend="${currentStatus == st ? 'active' : ''}"
                   th:href="@{/admin/returns(status=${st})}"
                   th:text="${st == 'ALL' ? 'Tất cả' :
                            (st == 'CHO_DUYET' ? 'Chờ duyệt' :
                            (st == 'DA_DUYET' ? 'Đã duyệt' :
                            (st == 'TU_CHOI' ? 'Từ chối' :
                            (st == 'CHO_KIEM_DINH' ? 'Chờ kiểm định' :
                            (st == 'DA_HOAN_TIEN' ? 'Đã hoàn tiền' :
                            (st == 'HOAN_TAT' ? 'Hoàn tất' : st))))))}">Tất cả</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Mã yêu cầu</th>
                        <th>Đơn hàng</th>
                        <th>Khách hàng</th>
                        <th>Lý do</th>
                        <th>Hoàn tiền</th>
                        <th>Trạng thái</th>
                        <th>Ngày gửi</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="req : ${requests}">
                        <td class="ps-4"><code class="fw-800 text-dark" th:text="'#' + ${req.id}">#1</code></td>
                        <td class="fw-700" th:text="${req.donHang.maDonHang}">DH001</td>
                        <td>
                            <div class="fw-700" th:text="${req.taiKhoan.hoTen}">Khách hàng</div>
                            <small class="text-muted" th:text="${req.taiKhoan.email}">email</small>
                        </td>
                        <td th:text="${req.lyDo}">Lý do</td>
                        <td>
                            <span class="refund-chip"
                                  th:text="${req.phuongThucHoanTien == 'BANK_TRANSFER' ? 'Chuyển khoản' :
                                           (req.phuongThucHoanTien == 'STORE_CREDIT' ? 'Ví mua hàng' :
                                           (req.phuongThucHoanTien == 'CASH' ? 'Tiền mặt' : req.phuongThucHoanTien))}">Chuyển khoản</span>
                        </td>
                        <td>
                            <span class="return-status"
                                  th:classappend="${req.trangThai == 'CHO_DUYET' or req.trangThai == 'PENDING' ? ' return-status-pending' :
                                                  (req.trangThai == 'DA_DUYET' or req.trangThai == 'APPROVED' ? ' return-status-approved' :
                                                  (req.trangThai == 'TU_CHOI' or req.trangThai == 'REJECTED' ? ' return-status-rejected' :
                                                  (req.trangThai == 'CHO_KIEM_DINH' ? ' return-status-inspection' :
                                                  (req.trangThai == 'DA_HOAN_TIEN' ? ' return-status-refunded' :
                                                  (req.trangThai == 'HOAN_TAT' ? ' return-status-done' : ' return-status-pending')))))}"
                                  th:text="${req.trangThai == 'CHO_DUYET' or req.trangThai == 'PENDING' ? 'Chờ duyệt' :
                                           (req.trangThai == 'DA_DUYET' or req.trangThai == 'APPROVED' ? 'Đã duyệt' :
                                           (req.trangThai == 'TU_CHOI' or req.trangThai == 'REJECTED' ? 'Từ chối' :
                                           (req.trangThai == 'CHO_KIEM_DINH' ? 'Chờ kiểm định' :
                                           (req.trangThai == 'DA_HOAN_TIEN' ? 'Đã hoàn tiền' :
                                           (req.trangThai == 'HOAN_TAT' ? 'Hoàn tất' : req.trangThai)))))}">Chờ duyệt</span>
                        </td>
                        <td class="small text-muted" th:text="${#temporals.format(req.ngayTao, 'dd/MM/yyyy HH:mm')}">01/01</td>
                        <td class="text-end pe-4">
                            <a th:href="@{/admin/returns/{id}(id=${req.id})}" class="btn-action">
                                <i class="fas fa-eye me-2"></i> Chi tiết
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="8" class="text-center py-5 text-muted">Không có yêu cầu trả hàng.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
