<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="sidebar" th:fragment="sidebar(active)">
    <a th:href="@{/}" class="sidebar-brand">
        <i class="fas fa-shopping-bag me-2"></i>
        <span>HANCOS</span>
    </a>

    <nav class="nav flex-column">
        <a class="nav-link"
           th:classappend="${active == 'dashboard'} ? ' active'"
           th:href="@{/admin/dashboard}">
            <i class="fas fa-th-large"></i><span class="nav-link-label">Dashboard</span>
        </a>

        <details class="nav-group"
                 th:attr="open=${active == 'products' or active == 'categories' or active == 'thuong-hieu' or active == 'chat-lieu'} ? 'open' : null"
                 th:classappend="${active == 'products' or active == 'categories' or active == 'thuong-hieu' or active == 'chat-lieu'} ? ' active'">
            <summary class="nav-link nav-link-parent"
                     th:classappend="${active == 'products' or active == 'categories' or active == 'thuong-hieu' or active == 'chat-lieu'} ? ' active'">
                <i class="fas fa-box-open"></i>
                <span class="nav-link-label">Quản lý sản phẩm</span>
                <span class="nav-toggle" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
            </summary>
            <div class="nav-sub">
                <a class="nav-link nav-sub-link"
                   th:classappend="${active == 'products'} ? ' active'"
                   th:href="@{/san-pham}">
                    <i class="fas fa-circle"></i><span class="nav-link-label">Sản phẩm</span>
                </a>
                <a class="nav-link nav-sub-link"
                   th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
                   th:classappend="${active == 'categories'} ? ' active'"
                   th:href="@{/admin/categories}">
                    <i class="fas fa-circle"></i><span class="nav-link-label">Danh mục</span>
                </a>
                <a class="nav-link nav-sub-link"
                   th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
                   th:classappend="${active == 'thuong-hieu'} ? ' active'"
                   th:href="@{/admin/thuong-hieu}">
                    <i class="fas fa-circle"></i><span class="nav-link-label">Thương hiệu</span>
                </a>
                <a class="nav-link nav-sub-link"
                   th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
                   th:classappend="${active == 'chat-lieu'} ? ' active'"
                   th:href="@{/admin/chat-lieu}">
                    <i class="fas fa-circle"></i><span class="nav-link-label">Chất liệu</span>
                </a>
            </div>
        </details>

        <a class="nav-link"
           th:classappend="${active == 'inventory'} ? ' active'"
           th:href="@{/admin/inventory}">
            <i class="fas fa-warehouse"></i><span class="nav-link-label">Quản lý kho</span>
        </a>

        <a class="nav-link"
           th:classappend="${active == 'pos'} ? ' active'"
           th:href="@{/admin/ban-hang-tai-quay}">
            <i class="fas fa-cash-register"></i><span class="nav-link-label">Bán hàng tại quầy</span>
        </a>

        <a class="nav-link"
           th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
           th:classappend="${active == 'vouchers'} ? ' active'"
           th:href="@{/admin/vouchers}">
            <i class="fas fa-ticket-alt"></i><span class="nav-link-label">Voucher</span>
        </a>

        <a class="nav-link"
           th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
           th:classappend="${active == 'thongke'} ? ' active'"
           th:href="@{/admin/thong-ke}">
            <i class="fas fa-chart-line"></i><span class="nav-link-label">Thống kê</span>
        </a>

        <details class="nav-group"
                 th:attr="open=${active == 'orders' or active == 'returns'} ? 'open' : null"
                 th:classappend="${active == 'orders' or active == 'returns'} ? ' active'">
            <summary class="nav-link nav-link-parent"
                     th:classappend="${active == 'orders' or active == 'returns'} ? ' active'">
                <i class="fas fa-receipt"></i>
                <span class="nav-link-label">Quản lý đơn hàng</span>
                <span class="nav-toggle" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
            </summary>
            <div class="nav-sub">
                <a class="nav-link nav-sub-link"
                   data-orders-link="true"
                   th:attr="data-pending-url=@{/admin/orders/pending-count}"
                   th:classappend="${active == 'orders'} ? ' active'"
                   th:href="@{/admin/orders}">
                    <i class="fas fa-circle"></i>
                    <span class="nav-link-label">Đơn hàng</span>
                    <span class="sidebar-badge"
                          th:if="${adminPendingOrderCount > 0}"
                          th:text="${adminPendingOrderCount}">0</span>
                </a>
                <a class="nav-link nav-sub-link"
                   th:classappend="${active == 'returns'} ? ' active'"
                   th:href="@{/admin/returns}">
                    <i class="fas fa-circle"></i><span class="nav-link-label">Trả hàng</span>
                </a>
            </div>
        </details>

        <a class="nav-link"
           th:if="${session.ROLES != null and #lists.contains(session.ROLES,'ADMIN')}"
           th:classappend="${active == 'users'} ? ' active'"
           th:href="@{/admin/users}">
            <i class="fas fa-users"></i><span class="nav-link-label">Tài khoản</span>
        </a>

        <div class="mt-auto pt-5">
            <hr class="text-white-50">
            <a class="nav-link text-danger" th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i><span class="nav-link-label">Đăng xuất</span>
            </a>
        </div>

    </nav>
</div>

<script>
    (function () {
        var ordersLink = document.querySelector('.sidebar [data-orders-link="true"]');
        if (!ordersLink) {
            return;
        }

        var pendingUrl = ordersLink.getAttribute('data-pending-url');
        if (!pendingUrl) {
            return;
        }

        if (!window.fetch) {
            return;
        }

        var renderBadge = function (count) {
            var badge = ordersLink.querySelector('.sidebar-badge');
            if (count > 0) {
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'sidebar-badge';
                    ordersLink.appendChild(badge);
                }
                badge.textContent = count > 99 ? '99+' : String(count);
            } else if (badge) {
                badge.remove();
            }
        };

        var fetchPendingCount = function () {
            fetch(pendingUrl, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(function (response) {
                    if (!response.ok) {
                        return null;
                    }
                    return response.json();
                })
                .then(function (data) {
                    if (!data) {
                        return;
                    }
                    var count = Number(data && data.count != null ? data.count : 0);
                    renderBadge(isFinite(count) ? count : 0);
                })
                .catch(function () {
                    // Ignore transient network errors for sidebar polling.
                });
        };

        fetchPendingCount();
        setInterval(fetchPendingCount, 30000);
    })();

    (function () {
        var sidebar = document.querySelector('.sidebar');
        if (!sidebar) {
            return;
        }

        var groups = Array.prototype.slice.call(sidebar.querySelectorAll('.nav-group'));
        if (!groups.length) {
            return;
        }

        var getParentToggle = function (group) {
            var children = Array.prototype.slice.call(group.children);
            for (var index = 0; index < children.length; index += 1) {
                var child = children[index];
                if (child.classList && child.classList.contains('nav-link-parent')) {
                    return child;
                }
            }
            return null;
        };

        var updateSidebarWidthState = function () {
            sidebar.classList.toggle('sidebar-expanded', Boolean(sidebar.querySelector('.nav-group[open], .nav-group.open')));
        };

        var setExpanded = function (group, isOpen) {
            var toggle = getParentToggle(group);
            group.classList.toggle('open', isOpen);
            if (group.tagName && group.tagName.toLowerCase() === 'details') {
                group.open = isOpen;
            }
            if (toggle) {
                toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }
        };

        groups.forEach(function (group) {
            setExpanded(group, group.hasAttribute('open') || group.classList.contains('open'));
        });
        updateSidebarWidthState();

        groups.forEach(function (group) {
            var toggle = getParentToggle(group);
            if (!toggle) {
                return;
            }

            toggle.addEventListener('click', function (event) {
                event.preventDefault();
                var shouldOpen = !(group.hasAttribute('open') || group.classList.contains('open'));
                groups.forEach(function (otherGroup) {
                    if (otherGroup !== group) {
                        setExpanded(otherGroup, false);
                    }
                });
                setExpanded(group, shouldOpen);
                updateSidebarWidthState();
            });
        });
    })();
</script>

</body>
</html>
