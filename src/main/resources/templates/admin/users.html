<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản - HANCOS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/users.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>

<div class="main-content">
    <header class="top-header">
        <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1">Quản lý tài khoản</h4>
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                <i class="fas fa-user-shield"></i>
            </div>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success border-0 rounded-0 small mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4" th:text="${errorMessage}"></div>

    <!-- Search & Filter -->
    <div class="card mb-4">
        <div class="card-body p-4">
            <form th:action="@{/admin/users}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" name="keyword" class="form-control border-start-0 ps-0" th:value="${keyword}" placeholder="Tên, Email, SĐT, Username...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select name="trangThai" class="form-select" onchange="this.form.submit()">
                        <option value="">Tất cả trạng thái</option>
                        <option value="ACTIVE" th:selected="${selectedTrangThai == 'ACTIVE'}">ACTIVE</option>
                        <option value="INACTIVE" th:selected="${selectedTrangThai == 'INACTIVE'}">INACTIVE</option>
                        <option value="LOCKED" th:selected="${selectedTrangThai == 'LOCKED'}">LOCKED</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="vaiTro" class="form-select" onchange="this.form.submit()">
                        <option value="">Tất cả vai trò</option>
                        <option th:each="role : ${allRoles}"
                                th:value="${role.ma}"
                                th:text="${role.ten + ' (' + role.ma + ')'}"
                                th:selected="${selectedVaiTro == role.ma}">Vai trò</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-dark w-100 fw-700 rounded-0 text-uppercase small letter-spacing-1">Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4" style="width: 80px;">ID</th>
                            <th>Người dùng</th>
                            <th>Thông tin liên hệ</th>
                            <th>Ngày tham gia</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-4 fw-700 text-dark" th:text="${user.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center fw-800 text-muted" style="width: 40px; height: 40px; font-size: 14px;" th:text="${#strings.substring(user.hoTen,0,1)}">U</div>
                                    <div>
                                        <div class="fw-700 text-dark" th:text="${user.hoTen}">Nguyễn Văn A</div>
                                        <small class="text-muted fw-600" style="font-size: 11px;">@<span th:text="${user.tenDangNhap}">admin</span></small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="small fw-600 text-dark"><i class="far fa-envelope me-2 text-muted"></i><span th:text="${user.email}">a@gmail.com</span></div>
                                <div class="small mt-1"><i class="fas fa-phone-alt me-2 text-muted"></i><span th:text="${user.soDienThoai}">0123456789</span></div>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(user.ngayTao, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td>
                                <div class="d-flex flex-wrap gap-1">
                                    <span th:each="rMa : ${user.vaiTroMas}" 
                                          class="badge bg-light text-dark border fw-600" 
                                          style="font-size: 10px;"
                                          th:text="${rMa}">ROLE</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2" 
                                      th:classappend="${user.trangThai == 'ACTIVE' ? 'badge-active' : (user.trangThai == 'LOCKED' ? 'badge-locked' : 'badge-inactive')}"
                                      th:text="${user.trangThai}">ACTIVE</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn-action" title="Chỉnh sửa">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button class="btn-action btn-delete" title="Xóa" th:onclick="'deleteUser(' + ${user.id} + ')'">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                <i class="fas fa-users-slash fa-3x mb-3 d-block opacity-20"></i>
                                Không tìm thấy tài khoản nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/admin/users.js}"></script>
</body>
</html>
