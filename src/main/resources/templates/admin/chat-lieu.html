<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chất liệu - HANCOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/categories.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('chat-lieu')}"></div>

<div class="main-content">
    <header class="top-header">
        <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1">Quản lý chất liệu</h4>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/chat-lieu/add}"
               class="btn btn-dark rounded-0 fw-700 text-uppercase small letter-spacing-1 px-4 py-2">
                <i class="fas fa-plus me-2"></i> Thêm chất liệu
            </a>
            <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center"
                 style="width: 45px; height: 45px;">
                <i class="fas fa-tags"></i>
            </div>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success border-0 rounded-0 small mb-4"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4"
         th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4" style="width: 80px;">ID</th>
                        <th>Tên chất liệu</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cl : ${chatLieus}">
                        <td class="ps-4 fw-700" th:text="${cl.id}">1</td>
                        <td th:text="${cl.tenChatLieu}">Cotton</td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${cl.trangThai == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${cl.trangThai}">ACTIVE</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/chat-lieu/edit/{id}(id=${cl.id})}" class="btn-action"
                                   title="Chỉnh sửa">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button class="btn-action btn-delete" title="Xóa"
                                        th:onclick="'deleteChatLieu(' + ${cl.id} + ')'">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(chatLieus)}">
                        <td colspan="4" class="text-center py-5 text-muted">Chưa có chất liệu nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/admin/chat-lieu.js}"></script>
</body>
</html>
