<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mauSac.id == null ? 'Thêm màu sắc' : 'Sửa màu sắc'} + ' - HANCOS'">Màu sắc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/category-form.css}">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('mau-sac')}"></div>

<div class="main-content">
    <header class="top-header">
        <div class="d-flex align-items-center">
            <a th:href="@{/admin/mau-sac}" class="btn-action me-3" aria-label="Quay lại">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h4 class="fw-800 mb-0 text-uppercase letter-spacing-1"
                th:text="${mauSac.id == null ? 'Thêm màu sắc' : 'Sửa màu sắc'}">Màu sắc</h4>
        </div>
        <div class="rounded-circle bg-soft-primary d-flex align-items-center justify-content-center"
             style="width: 45px; height: 45px;">
            <i class="fas fa-palette"></i>
        </div>
    </header>

    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-0 small mb-4"
         th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body p-4">
            <form id="mauSacForm" th:action="@{/admin/mau-sac/save}" th:object="${mauSac}" method="post" class="row g-3" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="col-md-5">
                    <label class="form-label fw-700">Tên màu <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{tenMau}" required minlength="2" maxlength="50"
                           placeholder="VD: Đen">
                    <div class="form-text">Tên màu dài từ 2 đến 50 ký tự.</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-700">Mã màu</label>
                    <input type="text" class="form-control" th:field="*{maMau}" maxlength="20"
                           placeholder="VD: #000000">
                    <div class="form-text">Có thể để trống.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-700">Trạng thái</label>
                    <select class="form-select" th:field="*{trangThai}">
                        <option value="ACTIVE">Hoạt động (ACTIVE)</option>
                        <option value="INACTIVE">Ngưng hoạt động (INACTIVE)</option>
                    </select>
                </div>

                <div class="col-12 mt-3 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-5 py-2 fw-700">
                        <i class="fas fa-save me-2"></i> Lưu màu
                    </button>
                    <a th:href="@{/admin/mau-sac}" class="btn btn-outline-secondary px-4 py-2 ms-2">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('mauSacForm').addEventListener('submit', (event) => {
        const form = event.currentTarget;
        const ten = form.querySelector('[name="tenMau"]');
        const ma = form.querySelector('[name="maMau"]');
        const trangThai = form.querySelector('[name="trangThai"]');
        const name = ten.value.trim();
        const code = ma.value.trim();
        const status = (trangThai.value || '').trim().toUpperCase();

        if (name.length < 2 || name.length > 50) {
            event.preventDefault();
            Swal.fire('Lỗi', 'Tên màu phải dài từ 2 đến 50 ký tự.', 'error');
            ten.focus();
            return;
        }
        if (code.length > 20) {
            event.preventDefault();
            Swal.fire('Lỗi', 'Mã màu không được vượt quá 20 ký tự.', 'error');
            ma.focus();
            return;
        }
        if (status !== 'ACTIVE' && status !== 'INACTIVE') {
            event.preventDefault();
            Swal.fire('Lỗi', 'Trạng thái màu không hợp lệ.', 'error');
            trangThai.focus();
            return;
        }

        ten.value = name;
        ma.value = code;
        trangThai.value = status;
    });
</script>
</body>
</html>
